name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]
  # The Lock workflow pushes breto.lock to Renovate's branches with a deploy
  # key, and such a push starts push workflows only.
  push:
    branches: [main, "renovate/**"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/breto@ee1344847682b2c1a1c5b5413da59be084662645 # 2026.11.16053738
        with:
          registries: .
      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
      - name: Lint the prose
        run: breto run ci-harper
      - name: Check that breto.lock pins every version the groups name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --check
  verify:
    name: Verify
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
