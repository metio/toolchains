name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@7bcd096b907a92d210885216dc2bcb9918612078 # 2026.10.31161821
        with:
          registries: .
      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
      - name: Check that breto.lock pins every version the groups name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --check
