name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@4c3ff90106d75c0d25543cd9305a496d8b67e514 # 2026.10.30064817
        with:
          registries: .
      - name: Lint
        run: breto run ci-lint
      - name: Check that breto.lock pins every version the groups name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --check
