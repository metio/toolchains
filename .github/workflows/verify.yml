name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/breto@9fa67afc6a21b59600180acd0cee7d5eb26125ef # 2026.10.31164824
        with:
          registries: .
      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
      - name: Check that breto.lock pins every version the groups name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --check
