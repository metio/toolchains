name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/breto@bfcb1a4d37c4fd4d5d9c27181191dcad0d04f90c # 2026.11.1211658
        with:
          registries: .
      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
      - name: Lint the prose
        run: breto run ci-harper
      - name: Check that breto.lock pins every version the groups name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --check
