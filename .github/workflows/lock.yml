name: Lock
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    # Renovate's branches only: the job pushes with an app token, which a pull
    # request from a fork must never reach.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.token.outputs.token }} # zizmor: ignore[artipacked] the job pushes breto.lock with it
      - uses: metio/breto@3d35cbfa61e9b8e98fe3d92113390a6db219b66c # 2026.10.30182439
        with:
          registries: .
      - name: Record the hashes of the pinned versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --platforms all
      - name: Push the lock file
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          if git diff --quiet -- breto.lock && git ls-files --error-unmatch breto.lock >/dev/null 2>&1; then
            echo "breto.lock is up to date"
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add breto.lock
          git commit --message "chore: lock the pinned versions"
          git push
