name: Lock
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    # Renovate's branches only: the job pushes with a deploy key, which a pull
    # request from a fork must never reach.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          ssh-key: ${{ secrets.LOCK_DEPLOY_KEY }}
          persist-credentials: true # zizmor: ignore[artipacked] the job pushes breto.lock with it
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: .
      - name: Record the hashes of the pinned versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: breto lock . --platforms all
      - name: Push the lock file
        run: |
          if git diff --quiet -- breto.lock && git ls-files --error-unmatch breto.lock >/dev/null 2>&1; then
            echo "breto.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breto.lock
          git commit --signoff --message "chore: lock the pinned versions"
          git push
